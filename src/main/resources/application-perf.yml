# 可复现压测专用配置。通过 SPRING_PROFILES_ACTIVE=perf 启用，避免 local 的 SQL/DEBUG 日志污染结果。
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enjoy_agent}
    username: ${DB_USERNAME:enjoy}
    password: ${DB_PASSWORD:enjoy123}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        observation-enabled: true
    template:
      observation-enabled: true
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: ${APP_HIBERNATE_STATISTICS:true}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.enjoy.agent: INFO
    org.hibernate.SQL: WARN
    org.hibernate.stat: WARN
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: "OFF"
    org.springframework.security: WARN

enjoy:
  security:
    jwt-secret: ${APP_JWT_SECRET:performance-only-jwt-secret-change-me}
    allow-insecure-development-secret: true
    access-token-cookie-secure: false
    expose-access-token-in-body: true
    allow-public-developer-endpoints: true
    outbound:
      allow-plain-http: true
      allowed-hosts:
        - 127.0.0.1
        - localhost
  credential:
    aes-key: ${APP_CREDENTIAL_AES_KEY:performance-only-aes-key-32-byte}
    allow-insecure-development-secret: true
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:enjoy-agent}
  mcp:
    approval:
      signing-secret: ${APP_MCP_APPROVAL_SIGNING_SECRET:development-only-mcp-approval-signing-secret}
      allow-insecure-development-secret: true
    oauth:
      public-base-url: ${APP_MCP_OAUTH_PUBLIC_BASE_URL:http://localhost:${server.port}}
  cache:
    agent-config-local-enabled: ${APP_CACHE_AGENT_CONFIG_LOCAL_ENABLED:true}
    agent-config-distributed-lock-enabled: ${APP_CACHE_AGENT_CONFIG_LOCK_ENABLED:true}
    auth-context-enabled: ${APP_CACHE_AUTH_CONTEXT_ENABLED:true}
    auth-context-local-enabled: ${APP_CACHE_AUTH_CONTEXT_LOCAL_ENABLED:true}
  knowledge:
    ingest:
      worker-concurrency: ${APP_KNOWLEDGE_INGEST_WORKER_CONCURRENCY:4}
      prefetch: ${APP_KNOWLEDGE_INGEST_PREFETCH:2}
      outbox-batch-size: ${APP_KNOWLEDGE_INGEST_OUTBOX_BATCH_SIZE:50}
