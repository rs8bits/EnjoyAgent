# 服务基础配置
server:
  port: ${SERVER_PORT:8080}

spring:
  # 应用名称
  application:
    name: enjoy-agent
  # 关闭默认用户密码，避免和我们自己的认证逻辑冲突
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:750ms}
      repositories:
        enabled: false
  # PostgreSQL 数据源配置
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:enjoy_agent}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        default-requeue-rejected: false
  servlet:
    multipart:
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:25MB}
  # JPA 基础配置
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# 日志级别配置
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [request=%X{requestId:-}] [tenant=%X{tenantId:-}] %logger{36} - %msg%n"
  level:
    com.enjoy.agent: INFO
    org.springframework.security: INFO

# 平台自定义配置
enjoy:
  sandbox:
    enabled: ${APP_SANDBOX_ENABLED:false}
    manager-url: ${SANDBOX_MANAGER_URL:http://127.0.0.1:8091}
    token-file: ${SANDBOX_TOKEN_FILE:.sandbox/manager-token}
    max-file-bytes: ${APP_SANDBOX_MAX_FILE_BYTES:20971520}
    max-stored-bytes-per-user: ${APP_SANDBOX_MAX_STORED_BYTES_PER_USER:2147483648}
    max-files-per-user: ${APP_SANDBOX_MAX_FILES_PER_USER:1000}
    max-active-tasks-per-tenant: ${APP_SANDBOX_MAX_ACTIVE_TASKS_PER_TENANT:20}
    max-output-bytes: ${APP_SANDBOX_MAX_OUTPUT_BYTES:209715200}
    default-timeout-seconds: ${APP_SANDBOX_DEFAULT_TIMEOUT_SECONDS:120}
  cache:
    agent-config-enabled: ${APP_CACHE_AGENT_CONFIG_ENABLED:true}
    agent-config-local-enabled: ${APP_CACHE_AGENT_CONFIG_LOCAL_ENABLED:true}
    agent-config-distributed-lock-enabled: ${APP_CACHE_AGENT_CONFIG_LOCK_ENABLED:true}
    auth-context-enabled: ${APP_CACHE_AUTH_CONTEXT_ENABLED:true}
    auth-context-local-enabled: ${APP_CACHE_AUTH_CONTEXT_LOCAL_ENABLED:true}
    session-summary-enabled: ${APP_CACHE_SESSION_SUMMARY_ENABLED:true}
    default-ttl: ${APP_CACHE_DEFAULT_TTL:10m}
    agent-config-ttl: ${APP_CACHE_AGENT_CONFIG_TTL:1h}
    agent-config-local-ttl: ${APP_CACHE_AGENT_CONFIG_LOCAL_TTL:30s}
    agent-config-local-maximum-size: ${APP_CACHE_AGENT_CONFIG_LOCAL_MAXIMUM_SIZE:10000}
    auth-context-ttl: ${APP_CACHE_AUTH_CONTEXT_TTL:30s}
    auth-context-local-ttl: ${APP_CACHE_AUTH_CONTEXT_LOCAL_TTL:5s}
    auth-context-local-maximum-size: ${APP_CACHE_AUTH_CONTEXT_LOCAL_MAXIMUM_SIZE:50000}
    session-summary-ttl: ${APP_CACHE_SESSION_SUMMARY_TTL:30m}
    distributed-lock-wait: ${APP_CACHE_DISTRIBUTED_LOCK_WAIT:500ms}
  security:
    jwt-secret: ${APP_JWT_SECRET}
    allow-insecure-development-secret: false
    issuer: ${APP_JWT_ISSUER:enjoy-agent}
    audience: ${APP_JWT_AUDIENCE:enjoy-agent-web}
    key-id: ${APP_JWT_KEY_ID:primary}
    previous-jwt-keys: ${APP_PREVIOUS_JWT_KEYS:}
    access-token-cookie-name: ${APP_ACCESS_TOKEN_COOKIE_NAME:enjoy_agent_access}
    access-token-cookie-secure: ${APP_ACCESS_TOKEN_COOKIE_SECURE:true}
    access-token-cookie-same-site: ${APP_ACCESS_TOKEN_COOKIE_SAME_SITE:Strict}
    expose-access-token-in-body: ${APP_EXPOSE_ACCESS_TOKEN_IN_BODY:false}
    allow-public-developer-endpoints: false
    allowed-browser-origins: ${APP_ALLOWED_BROWSER_ORIGINS:}
    access-token-expiration-seconds: ${APP_ACCESS_TOKEN_EXPIRATION_SECONDS:7200}
  credential:
    aes-key: ${APP_CREDENTIAL_AES_KEY}
    previous-aes-keys: ${APP_CREDENTIAL_PREVIOUS_AES_KEYS:}
    allow-insecure-development-secret: false
  model-gateway:
    openai-base-url: ${APP_MODEL_GATEWAY_OPENAI_BASE_URL:https://api.openai.com}
    platform-openai-api-key: ${APP_PLATFORM_OPENAI_API_KEY:}
    connect-timeout-seconds: ${APP_MODEL_GATEWAY_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${APP_MODEL_GATEWAY_READ_TIMEOUT_SECONDS:300}
    max-response-bytes: ${APP_MODEL_GATEWAY_MAX_RESPONSE_BYTES:2000000}
    max-response-chars: ${APP_MODEL_GATEWAY_MAX_RESPONSE_CHARS:500000}
    max-prompt-chars: ${APP_MODEL_GATEWAY_MAX_PROMPT_CHARS:400000}
    max-prompt-bytes: ${APP_MODEL_GATEWAY_MAX_PROMPT_BYTES:1000000}
  # 平台 AI 客服拥有独立、严格的小上下文预算。official-model-config-id 必须显式
  # 指向一个已启用的官方 CHAT 模型，避免不同环境因数据库排序而选到不同模型。
  support:
    enabled: ${APP_SUPPORT_ENABLED:true}
    official-model-config-id: ${APP_SUPPORT_OFFICIAL_MODEL_CONFIG_ID:}
    max-user-message-chars: ${APP_SUPPORT_MAX_USER_MESSAGE_CHARS:4000}
    recent-message-limit: ${APP_SUPPORT_RECENT_MESSAGE_LIMIT:12}
    max-input-token-upper-bound: ${APP_SUPPORT_MAX_INPUT_TOKEN_UPPER_BOUND:16000}
    max-tool-result-chars: ${APP_SUPPORT_MAX_TOOL_RESULT_CHARS:4000}
    max-output-tokens: ${APP_SUPPORT_MAX_OUTPUT_TOKENS:2048}
    max-assistant-chars: ${APP_SUPPORT_MAX_ASSISTANT_CHARS:8000}
    max-skills-per-turn: ${APP_SUPPORT_MAX_SKILLS_PER_TURN:3}
    skill-page-size: ${APP_SUPPORT_SKILL_PAGE_SIZE:10}
    emitter-timeout-ms: ${APP_SUPPORT_EMITTER_TIMEOUT_MS:300000}
    confirmation-ttl-minutes: ${APP_SUPPORT_CONFIRMATION_TTL_MINUTES:10}
    project-name: ${APP_SUPPORT_PROJECT_NAME:EnjoyAgent}
  billing:
    enabled: ${APP_BILLING_ENABLED:false}
    currency: ${APP_BILLING_CURRENCY:CNY}
    reservation-tokens: ${APP_BILLING_RESERVATION_OUTPUT_TOKENS:4096}
    reservation-max-input-tokens: ${APP_BILLING_RESERVATION_MAX_INPUT_TOKENS:1000000}
    reservation-max-output-tokens: ${APP_BILLING_RESERVATION_MAX_OUTPUT_TOKENS:131072}
    reservation-ttl: ${APP_BILLING_RESERVATION_TTL:10m}
    reservation-release-claim-timeout: ${APP_BILLING_RESERVATION_RELEASE_CLAIM_TIMEOUT:1m}
    minimum-reservation-amount: ${APP_BILLING_MINIMUM_RESERVATION_AMOUNT:0.000001}
    processing-max-attempts: ${APP_BILLING_PROCESSING_MAX_ATTEMPTS:5}
    processing-retry-delay: ${APP_BILLING_PROCESSING_RETRY_DELAY:10s}
    reservation-reaper-delay-ms: ${APP_BILLING_RESERVATION_REAPER_DELAY_MS:30000}
    reservation-reaper-initial-delay-ms: ${APP_BILLING_RESERVATION_REAPER_INITIAL_DELAY_MS:30000}
    outbox-relay-delay-ms: ${APP_BILLING_OUTBOX_RELAY_DELAY_MS:500}
    outbox-relay-initial-delay-ms: ${APP_BILLING_OUTBOX_RELAY_INITIAL_DELAY_MS:500}
    rabbit:
      exchange: ${APP_BILLING_RABBIT_EXCHANGE:enjoy.agent.events}
      usage-routing-key: ${APP_BILLING_RABBIT_USAGE_ROUTING_KEY:billing.usage}
      usage-queue: ${APP_BILLING_RABBIT_USAGE_QUEUE:billing.usage.queue}
      usage-dead-letter-routing-key: ${APP_BILLING_RABBIT_USAGE_DLQ_ROUTING_KEY:billing.usage.dlq}
      usage-dead-letter-queue: ${APP_BILLING_RABBIT_USAGE_DLQ:billing.usage.dlq}
      publisher-confirm-timeout: ${APP_BILLING_RABBIT_PUBLISHER_CONFIRM_TIMEOUT:5s}
      outbox-claim-timeout: ${APP_BILLING_RABBIT_OUTBOX_CLAIM_TIMEOUT:30s}
      outbox-publish-retry-delay: ${APP_BILLING_RABBIT_OUTBOX_PUBLISH_RETRY_DELAY:2s}
      reconciliation-delay: ${APP_BILLING_RABBIT_RECONCILIATION_DELAY:1m}
      outbox-batch-size: ${APP_BILLING_RABBIT_OUTBOX_BATCH_SIZE:50}
  mcp:
    approval:
      signing-secret: ${APP_MCP_APPROVAL_SIGNING_SECRET}
      previous-signing-secrets: ${APP_MCP_APPROVAL_PREVIOUS_SIGNING_SECRETS:}
      allow-insecure-development-secret: false
    oauth:
      public-base-url: ${APP_MCP_OAUTH_PUBLIC_BASE_URL}
      callback-path: ${APP_MCP_OAUTH_CALLBACK_PATH:/api/mcp/oauth/callback}
      refresh-skew-seconds: ${APP_MCP_OAUTH_REFRESH_SKEW_SECONDS:60}
      authorization-ttl-seconds: ${APP_MCP_OAUTH_AUTHORIZATION_TTL_SECONDS:600}
      max-token-response-bytes: ${APP_MCP_OAUTH_MAX_TOKEN_RESPONSE_BYTES:262144}
      max-metadata-response-bytes: ${APP_MCP_OAUTH_MAX_METADATA_RESPONSE_BYTES:1000000}
    runtime:
      max-tool-rounds: ${APP_MCP_MAX_TOOL_ROUNDS:3}
      max-tool-result-chars: ${APP_MCP_MAX_TOOL_RESULT_CHARS:4000}
      http-connect-timeout-seconds: ${APP_MCP_HTTP_CONNECT_TIMEOUT_SECONDS:10}
      http-read-timeout-seconds: ${APP_MCP_HTTP_READ_TIMEOUT_SECONDS:60}
      max-tool-response-chars: ${APP_MCP_MAX_TOOL_RESPONSE_CHARS:100000}
      max-http-response-bytes: ${APP_MCP_MAX_HTTP_RESPONSE_BYTES:1048576}
      max-tool-calls-per-turn: ${APP_MCP_MAX_TOOL_CALLS_PER_TURN:20}
      max-cumulative-tool-result-chars: ${APP_MCP_MAX_CUMULATIVE_TOOL_RESULT_CHARS:20000}
      max-cumulative-model-tokens-per-turn: ${APP_MCP_MAX_CUMULATIVE_MODEL_TOKENS_PER_TURN:100000}
      default-max-output-tokens-per-model-call: ${APP_MCP_DEFAULT_MAX_OUTPUT_TOKENS_PER_MODEL_CALL:4096}
  workflow:
    runtime:
      max-model-calls: ${APP_WORKFLOW_MAX_MODEL_CALLS:20}
      max-total-model-tokens: ${APP_WORKFLOW_MAX_TOTAL_MODEL_TOKENS:100000}
      max-duration-seconds: ${APP_WORKFLOW_MAX_DURATION_SECONDS:300}
      max-tool-calls: ${APP_WORKFLOW_MAX_TOOL_CALLS:20}
      max-cumulative-tool-result-chars: ${APP_WORKFLOW_MAX_CUMULATIVE_TOOL_RESULT_CHARS:100000}
      max-prompt-token-upper-bound-per-call: ${APP_WORKFLOW_MAX_PROMPT_TOKEN_UPPER_BOUND_PER_CALL:250000}
      default-max-output-tokens: ${APP_WORKFLOW_DEFAULT_MAX_OUTPUT_TOKENS:4096}
  knowledge:
    chunk-size: ${APP_KNOWLEDGE_CHUNK_SIZE:800}
    chunk-overlap: ${APP_KNOWLEDGE_CHUNK_OVERLAP:100}
    embedding-dimensions: ${APP_KNOWLEDGE_EMBEDDING_DIMENSIONS:1024}
    embedding-batch-size: ${APP_KNOWLEDGE_EMBEDDING_BATCH_SIZE:20}
    embedding-connect-timeout: ${APP_KNOWLEDGE_EMBEDDING_CONNECT_TIMEOUT:3s}
    embedding-read-timeout: ${APP_KNOWLEDGE_EMBEDDING_READ_TIMEOUT:20s}
    embedding-request-timeout: ${APP_KNOWLEDGE_EMBEDDING_REQUEST_TIMEOUT:30s}
    embedding-max-response-bytes: ${APP_KNOWLEDGE_EMBEDDING_MAX_RESPONSE_BYTES:8388608}
    max-file-size-bytes: ${APP_KNOWLEDGE_MAX_FILE_SIZE_BYTES:20971520}
    max-pdf-pages: ${APP_KNOWLEDGE_MAX_PDF_PAGES:500}
    max-extracted-text-chars: ${APP_KNOWLEDGE_MAX_EXTRACTED_TEXT_CHARS:2000000}
    max-chunks-per-document: ${APP_KNOWLEDGE_MAX_CHUNKS_PER_DOCUMENT:10000}
    max-active-imports-per-tenant: ${APP_KNOWLEDGE_MAX_ACTIVE_IMPORTS_PER_TENANT:8}
    max-documents-per-tenant: ${APP_KNOWLEDGE_MAX_DOCUMENTS_PER_TENANT:1000}
    max-source-bytes-per-tenant: ${APP_KNOWLEDGE_MAX_SOURCE_BYTES_PER_TENANT:2147483648}
    max-chunks-per-tenant: ${APP_KNOWLEDGE_MAX_CHUNKS_PER_TENANT:200000}
    extraction-timeout: ${APP_KNOWLEDGE_EXTRACTION_TIMEOUT:2m}
    max-concurrent-extractions: ${APP_KNOWLEDGE_MAX_CONCURRENT_EXTRACTIONS:4}
    extraction-admission-timeout: ${APP_KNOWLEDGE_EXTRACTION_ADMISSION_TIMEOUT:1s}
    recall-top-k: ${APP_KNOWLEDGE_RECALL_TOP_K:12}
    retrieval-top-k: ${APP_KNOWLEDGE_RETRIEVAL_TOP_K:4}
    query-rewrite-enabled: ${APP_KNOWLEDGE_QUERY_REWRITE_ENABLED:true}
    query-rewrite-max-context-messages: ${APP_KNOWLEDGE_QUERY_REWRITE_MAX_CONTEXT_MESSAGES:6}
    retrieval-debug-enabled: ${APP_KNOWLEDGE_RETRIEVAL_DEBUG_ENABLED:true}
    rerank-base-url: ${APP_KNOWLEDGE_RERANK_BASE_URL:https://dashscope.aliyuncs.com}
    rerank-connect-timeout: ${APP_KNOWLEDGE_RERANK_CONNECT_TIMEOUT:3s}
    rerank-read-timeout: ${APP_KNOWLEDGE_RERANK_READ_TIMEOUT:10s}
    rerank-request-timeout: ${APP_KNOWLEDGE_RERANK_REQUEST_TIMEOUT:15s}
    rerank-max-response-bytes: ${APP_KNOWLEDGE_RERANK_MAX_RESPONSE_BYTES:1048576}
    ingest:
      async-enabled: ${APP_KNOWLEDGE_ASYNC_INGEST_ENABLED:true}
      exchange: ${APP_KNOWLEDGE_INGEST_EXCHANGE:enjoy.knowledge.events}
      routing-key: ${APP_KNOWLEDGE_INGEST_ROUTING_KEY:knowledge.document.ingest}
      queue: ${APP_KNOWLEDGE_INGEST_QUEUE:knowledge.document.ingest.queue}
      parking-routing-key: ${APP_KNOWLEDGE_INGEST_PARKING_ROUTING_KEY:knowledge.document.ingest.parking}
      parking-queue: ${APP_KNOWLEDGE_INGEST_PARKING_QUEUE:knowledge.document.ingest.parking}
      worker-concurrency: ${APP_KNOWLEDGE_INGEST_WORKER_CONCURRENCY:4}
      prefetch: ${APP_KNOWLEDGE_INGEST_PREFETCH:2}
      max-attempts: ${APP_KNOWLEDGE_INGEST_MAX_ATTEMPTS:3}
      retry-delays: ${APP_KNOWLEDGE_INGEST_RETRY_DELAYS:5s,30s}
      outbox-batch-size: ${APP_KNOWLEDGE_INGEST_OUTBOX_BATCH_SIZE:50}
      outbox-claim-timeout: ${APP_KNOWLEDGE_INGEST_OUTBOX_CLAIM_TIMEOUT:30s}
      publisher-confirm-timeout: ${APP_KNOWLEDGE_INGEST_PUBLISHER_CONFIRM_TIMEOUT:5s}
      outbox-publish-retry-delay: ${APP_KNOWLEDGE_INGEST_OUTBOX_PUBLISH_RETRY_DELAY:2s}
      processing-lease-duration: ${APP_KNOWLEDGE_INGEST_PROCESSING_LEASE_DURATION:10m}
      lease-reaper-batch-size: ${APP_KNOWLEDGE_INGEST_LEASE_REAPER_BATCH_SIZE:50}
      lease-reaper-delay-ms: ${APP_KNOWLEDGE_INGEST_LEASE_REAPER_DELAY_MS:30000}
      lease-reaper-initial-delay-ms: ${APP_KNOWLEDGE_INGEST_LEASE_REAPER_INITIAL_DELAY_MS:30000}
      cleanup-batch-size: ${APP_KNOWLEDGE_INGEST_CLEANUP_BATCH_SIZE:20}
      cleanup-grace-period: ${APP_KNOWLEDGE_INGEST_CLEANUP_GRACE_PERIOD:30s}
      cleanup-claim-timeout: ${APP_KNOWLEDGE_INGEST_CLEANUP_CLAIM_TIMEOUT:2m}
      cleanup-retry-delay: ${APP_KNOWLEDGE_INGEST_CLEANUP_RETRY_DELAY:10s}
      cleanup-relay-delay-ms: ${APP_KNOWLEDGE_INGEST_CLEANUP_RELAY_DELAY_MS:1000}
      cleanup-relay-initial-delay-ms: ${APP_KNOWLEDGE_INGEST_CLEANUP_RELAY_INITIAL_DELAY_MS:1000}
      outbox-relay-delay-ms: ${APP_KNOWLEDGE_INGEST_OUTBOX_RELAY_DELAY_MS:500}
      outbox-relay-initial-delay-ms: ${APP_KNOWLEDGE_INGEST_OUTBOX_RELAY_INITIAL_DELAY_MS:500}
    search:
      enabled: ${APP_KNOWLEDGE_SEARCH_ENABLED:false}
      base-url: ${APP_KNOWLEDGE_SEARCH_BASE_URL:http://localhost:9200}
      username: ${APP_KNOWLEDGE_SEARCH_USERNAME:}
      password: ${APP_KNOWLEDGE_SEARCH_PASSWORD:}
      index-name: ${APP_KNOWLEDGE_SEARCH_INDEX_NAME:knowledge-chunk-v1}
      dense-top-k: ${APP_KNOWLEDGE_SEARCH_DENSE_TOP_K:12}
      lexical-top-k: ${APP_KNOWLEDGE_SEARCH_LEXICAL_TOP_K:12}
      rrf-k: ${APP_KNOWLEDGE_SEARCH_RRF_K:60}
      connect-timeout-seconds: ${APP_KNOWLEDGE_SEARCH_CONNECT_TIMEOUT_SECONDS:5}
      read-timeout-seconds: ${APP_KNOWLEDGE_SEARCH_READ_TIMEOUT_SECONDS:20}
      index-analyzer: ${APP_KNOWLEDGE_SEARCH_INDEX_ANALYZER:standard}
      search-analyzer: ${APP_KNOWLEDGE_SEARCH_SEARCH_ANALYZER:standard}
      bulk-batch-size: ${APP_KNOWLEDGE_SEARCH_BULK_BATCH_SIZE:250}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:enjoy-agent}

# OpenAPI / Swagger UI 调试配置
springdoc:
  api-docs:
    enabled: ${APP_OPENAPI_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${APP_OPENAPI_ENABLED:false}
    path: /swagger-ui.html
    try-it-out-enabled: true
    # Never persist bearer credentials in browser storage, even when the local
    # developer UI is explicitly enabled.
    persist-authorization: false
    display-request-duration: true

# Actuator 默认只暴露探针；生产环境显式启用其他端点并配合管理网鉴权。
management:
  endpoints:
    web:
      exposure:
        include: ${APP_MANAGEMENT_EXPOSED_ENDPOINTS:health,info}
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms,25ms,50ms,100ms,250ms,500ms,1s,2s,5s
