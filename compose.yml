services:
  sandbox-runtime-image:
    image: enjoyagent-python:local
    build:
      context: ./sandbox/runtime
    restart: "no"
    entrypoint: ["python", "-c", "print('Sandbox runtime image is ready')"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  sandbox-documents-image:
    image: enjoyagent-documents:local
    build:
      context: ./sandbox/documents
      additional_contexts:
        sandbox_base: service:sandbox-runtime-image
    restart: "no"
    entrypoint: ["python", "-c", "print('Document runtime image is ready')"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  sandbox-manager:
    image: enjoyagent-sandbox-manager:local
    build:
      context: ./sandbox/manager
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SANDBOX_MANAGER_PORT:-8091}:8091"
    environment:
      SANDBOX_WORK_ROOT: ${SANDBOX_WORK_ROOT:-${PWD}/.sandbox/work}
      SANDBOX_TOKEN_FILE: /run/secrets/sandbox-token
      SANDBOX_RUNTIME_IMAGE: enjoyagent-python:local
      SANDBOX_DOCUMENT_IMAGE: enjoyagent-documents:local
      SANDBOX_NAMESPACE: ${SANDBOX_NAMESPACE:-enjoyagent-local}
      SANDBOX_MAX_CONCURRENT: ${SANDBOX_MAX_CONCURRENT:-2}
      SANDBOX_MAX_PER_TENANT: ${SANDBOX_MAX_PER_TENANT:-1}
      SANDBOX_MEMORY_BYTES: ${SANDBOX_MEMORY_BYTES:-1073741824}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
      SANDBOX_MAX_OUTPUT_BYTES: ${APP_SANDBOX_MAX_OUTPUT_BYTES:-209715200}
      SANDBOX_MAX_WORKSPACE_BYTES: ${SANDBOX_MAX_WORKSPACE_BYTES:-1073741824}
      SANDBOX_MAX_LOG_BYTES: ${SANDBOX_MAX_LOG_BYTES:-1048576}
      SANDBOX_RETENTION_HOURS: ${SANDBOX_RETENTION_HOURS:-168}
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ./.sandbox/manager-token:/run/secrets/sandbox-token:ro
      # The same absolute path must exist in Manager and on the Docker daemon host.
      - ${SANDBOX_WORK_ROOT:-${PWD}/.sandbox/work}:${SANDBOX_WORK_ROOT:-${PWD}/.sandbox/work}
    depends_on:
      sandbox-runtime-image:
        condition: service_completed_successfully
      sandbox-documents-image:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8091/health | grep -q '\"ready\":true'"]
      interval: 10s
      timeout: 15s
      retries: 6

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-enjoy_agent}
      POSTGRES_USER: ${DB_USERNAME:-enjoy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-enjoy123}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-enjoy} -d ${DB_NAME:-enjoy_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
      - "${BIND_ADDRESS:-127.0.0.1}:${RABBITMQ_PROMETHEUS_PORT:-15692}:15692"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${ES_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USERNAME:-enjoy}:${DB_PASSWORD:-enjoy123}@postgres:5432/${DB_NAME:-enjoy_agent}?sslmode=disable
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${POSTGRES_EXPORTER_PORT:-9187}:9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${REDIS_EXPORTER_PORT:-9121}:9121"
    depends_on:
      redis:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres-exporter
      - redis-exporter
      - rabbitmq

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-enjoy-agent}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres-data:
  redis-data:
  minio-data:
  rabbitmq-data:
  elasticsearch-data:
  prometheus-data:
  grafana-data:
